<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>승무원 준비 루틴 다이어리</title>
  <!-- 전체 화면을 한 장의 이미지로 변환해주는 라이브러리 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    :root {
      --primary-color: #8FD6F2;   /* 연한 하늘색 메인 컬러 */
      --primary-deep: #4CADDD;    /* 버튼/강조용 진한 하늘색 */
      --ink: #10151C;             /* 테두리 & 텍스트용 블랙 */
      --bg-color: #EAF7FC;
      --card-bg: #ffffff;
      --border-color: #10151C;
      --muted: #45525E;
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 800px;
      margin: 0 auto;
      padding: 20px 16px 40px;
      background-color: var(--bg-color);
      color: var(--ink);
    }

    h1 {
      text-align: left;
      color: var(--ink);
      margin: 0 0 16px;
      font-size: 1.9rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: var(--primary-color);
      border: 1px solid var(--ink);
      border-radius: 10px;
      padding: 18px 20px;
    }
    h3 {
      margin: 0;
      font-size: 1rem;
      font-weight: 700;
      color: var(--ink);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    h3 span { color: var(--primary-deep); font-weight: 800; }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 2px 2px 0 rgba(16,21,28,0.08);
    }

    /* 프로필 정보 + 체중&수면 기록을 같은 높이로 나란히 배치 */
    .row-2col { display: flex; align-items: stretch; gap: 14px; margin-bottom: 14px; }
    .row-2col .card { margin-bottom: 0; display: flex; flex-direction: column; }
    .row-2col .card:first-child { flex: 0 0 34%; }
    .row-2col .card:last-child { flex: 1; min-width: 0; }
    .row-2col .section-body { flex: 1; display: flex; }
    .row-2col .section-body .grid-4 { flex: 1; align-content: center; }

    /* 모바일 가독성을 위한 접기/펴기 세션 스타일 */
    .section-header { cursor: pointer; padding-bottom: 4px; }
    .section-body { margin-top: 12px; display: block; }
    .section-body.collapsed { display: none; }

    .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
    .grid-2 > div, .grid-3 > div, .grid-4 > div { min-width: 0; }

    label { font-weight: 700; font-size: 0.82rem; display: block; margin-bottom: 6px; color: var(--muted); }
    input[type="text"], input[type="number"], input[type="time"], textarea {
      width: 100%;
      padding: 10px;
      box-sizing: border-box;
      border: 1px solid #B7DEEE;
      border-radius: 8px;
      font-size: 0.9rem;
      background: #F7FCFE;
      color: var(--ink);
    }
    input[type="text"]:focus, input[type="number"]:focus, input[type="time"]:focus, textarea:focus {
      outline: none;
      border-color: var(--primary-deep);
      background: #ffffff;
    }
    textarea { resize: vertical; height: 80px; }

    /* 이미지 업로드 & 미리보기 박스 디자인 */
    .img-upload-box {
      border: 1px dashed var(--primary-deep);
      border-radius: 8px;
      padding: 8px;
      text-align: center;
      background: #F0FAFD;
      position: relative;
      overflow: hidden;
      min-height: 84px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .img-upload-box::before {
      content: '+';
      font-size: 2rem;
      font-weight: 300;
      line-height: 1;
      color: var(--primary-deep);
      pointer-events: none;
    }
    .img-upload-box.has-image {
      padding: 0;
      min-height: 0;
      display: block;
    }
    .img-upload-box.has-image::before { display: none; }
    /* 아침/점심/저녁, 기사 스크랩 사진은 작은 썸네일 크기로 (체중 사진은 기존 크기 유지) */
    .img-upload-box--sm { max-width: 130px; margin: 0 auto; }
    .img-upload-box--sm.has-image { margin: 0 auto; }
    .img-upload-box--article { max-width: 220px; margin: 0; }
    .img-upload-box--article.has-image { margin: 0; }
    .img-upload-box input[type="file"] {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
      margin: 0;
    }
    .img-upload-box.has-image input[type="file"] {
      /* 사진이 있을 땐 다시 탭해서 바꿀 수 있게 클릭 영역만 유지 */
      z-index: 2;
    }
    .preview-img {
      max-width: 100%;
      width: 100%;
      height: auto;
      display: none;
      margin-top: 0;
      object-fit: cover;
      border: 1px solid var(--ink);
    }
    .img-upload-box.has-image .preview-img { border-radius: 8px; display: block; }

    .profile-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.85rem;
      background: #F0FAFD;
      border: 1px solid #B7DEEE;
      border-radius: 8px;
      padding: 10px 12px;
    }
    .btn {
      background: var(--primary-deep);
      color: #10151C;
      border: 1px solid var(--ink);
      padding: 14px;
      border-radius: 10px;
      font-weight: 800;
      cursor: pointer;
      width: 100%;
      font-size: 1rem;
      margin-top: 10px;
      box-shadow: 2px 2px 0 rgba(16,21,28,0.15);
      transition: transform 0.08s ease;
    }
    .btn:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 rgba(16,21,28,0.15); }
    .btn-edit {
      background: var(--primary-color);
      color: var(--ink);
      padding: 6px 12px;
      font-size: 0.78rem;
      font-weight: 700;
      border: 1px solid var(--ink);
      border-radius: 6px;
      cursor: pointer;
    }

    @media (max-width: 600px) {
      .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
      .row-2col { flex-direction: column; }
      .row-2col .card:first-child { flex: 1; }
    }
  </style>
</head>
<body>

  <!-- 전체 이미자로 캡처될 구역 시작 -->
  <div id="export-area">
    <h1>Routine Diary</h1>

    <!-- 헤더/프로필 + 체중&수면 기록을 한 줄로 배치 -->
    <div class="row-2col">
      <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
          <h2 id="today-date" style="margin: 0; font-size: 1.1rem; color: #4a5568;"></h2>
          <button class="btn-edit" data-html2canvas-ignore="true" onclick="editProfile()">프로필 정보 수정</button>
        </div>
        <div class="profile-info" style="flex-direction: column; align-items: stretch;">
          <div><strong>이름:</strong> <span id="prof-name">여주은</span></div>
          <div><strong>키:</strong> <span id="prof-height">164</span> cm</div>
          <div><strong>목표 체중:</strong> <span id="prof-target-weight">50</span> kg</div>
          <div><strong>목표 기간:</strong> <span id="prof-period">2026.12.31</span></div>
        </div>
      </div>

      <div class="card">
        <div class="section-header" onclick="toggleSection(this)">
          <h3>1. 오늘의 체중 & 수면 기록 <span>▲</span></h3>
        </div>
        <div class="section-body">
          <div class="grid-4">
            <div>
              <label>오늘 체중 (kg)</label>
              <input type="number" id="today-weight" step="0.1" placeholder="00.0">
            </div>
            <div>
              <label>체중 사진</label>
              <div class="img-upload-box" id="weight-photo-box">
                <input type="file" accept="image/*" onchange="previewImage(this, 1)">
                <img class="preview-img" alt="체중 사진 미리보기">
              </div>
            </div>
            <div>
              <label>기상 시간</label>
              <input type="time" id="wake-time">
            </div>
            <div>
              <label>취침 시간</label>
              <input type="time" id="sleep-time">
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 목표 및 계획 -->
    <div class="card">
      <div class="section-header" onclick="toggleSection(this)">
        <h3>2. Diet 및 운동 계획 <span>▲</span></h3>
      </div>
      <div class="section-body">
        <textarea id="diet-plan" placeholder="운동, 식단 등"></textarea>
      </div>
    </div>

    <!-- 식단 및 음수량 -->
    <div class="card">
      <div class="section-header" onclick="toggleSection(this)">
        <h3>3. 오늘의 식단 <span>▲</span></h3>
      </div>
      <div class="section-body">
        <div class="grid-3" style="margin-bottom: 16px;">
          <div>
            <label>아침</label>
            <div class="img-upload-box img-upload-box--sm" id="breakfast-photo-box">
              <input type="file" accept="image/*" onchange="previewImage(this, 1)">
              <img class="preview-img" alt="아침 미리보기">
            </div>
            <input type="text" id="breakfast-text" placeholder="아침 식단" style="margin-top: 6px;">
          </div>
          <div>
            <label>점심</label>
            <div class="img-upload-box img-upload-box--sm" id="lunch-photo-box">
              <input type="file" accept="image/*" onchange="previewImage(this, 1)">
              <img class="preview-img" alt="점심 미리보기">
            </div>
            <input type="text" id="lunch-text" placeholder="점심 식단" style="margin-top: 6px;">
          </div>
          <div>
            <label>저녁</label>
            <div class="img-upload-box img-upload-box--sm" id="dinner-photo-box">
              <input type="file" accept="image/*" onchange="previewImage(this, 1)">
              <img class="preview-img" alt="저녁 미리보기">
            </div>
            <input type="text" id="dinner-text" placeholder="저녁 식단" style="margin-top: 6px;">
          </div>
        </div>
        <div>
          <label>음수량 체크 (목표: 2,000 ml)</label>
          <input type="range" id="water-range" min="0" max="2000" step="250" value="0" oninput="document.getElementById('water-val').innerText = this.value + ' ml'">
          <span id="water-val" style="font-weight: bold; color: var(--primary-color);">0 ml</span>
        </div>
      </div>
    </div>

    <!-- 항공 기사 스크랩 -->
    <div class="card">
      <div class="section-header" onclick="toggleSection(this)">
        <h3>4. 항공 관련 기사 스크랩 <span>▲</span></h3>
      </div>
      <div class="section-body">
        <div style="margin-bottom: 10px;">
          <label>기사 스크랩 이미지</label>
          <div class="img-upload-box img-upload-box--article" id="article-photo-box">
            <input type="file" accept="image/*" onchange="previewImage(this, 1.5)">
            <img class="preview-img" alt="기사 스크랩 미리보기">
          </div>
        </div>
        <div class="grid-2">
          <div>
            <label>핵심 요약</label>
            <textarea id="article-summary" style="height: 140px;" placeholder=""></textarea>
          </div>
          <div>
            <label>느낀점</label>
            <textarea id="article-feeling" style="height: 140px;" placeholder=""></textarea>
          </div>
        </div>
      </div>
    </div>

    <!-- 일일 회고 -->
    <div class="card">
      <div class="section-header" onclick="toggleSection(this)">
        <h3>5. 오늘 하루 일과 <span>▲</span></h3>
      </div>
      <div class="section-body">
        <textarea id="daily-log" style="height: 180px;" placeholder="운동, 면접준비, 과제 등"></textarea>
      </div>
    </div>
  </div>
  <!-- 전체 캡처 구역 끝 -->

  <!-- 저장 및 이미지 내보내기 버튼 -->
  <button class="btn" onclick="exportToImage()">사진으로 내보내기</button>

  <script>
    // 오늘 날짜 자동 로드
    const today = new Date();
    const formattedDate = `${today.getFullYear()}년 ${today.getMonth() + 1}월 ${today.getDate()}일`;
    document.getElementById('today-date').innerText = formattedDate;

    // 프로필 정보 입력/수정
    function editProfile() {
      const name = prompt("이름을 입력하세요:", document.getElementById('prof-name').innerText);
      const height = prompt("키(cm)를 입력하세요:", document.getElementById('prof-height').innerText);
      const weight = prompt("목표 체중(kg)을 입력하세요:", document.getElementById('prof-target-weight').innerText);
      const period = prompt("목표 기간을 입력하세요:", document.getElementById('prof-period').innerText);

      if (name) document.getElementById('prof-name').innerText = name;
      if (height) document.getElementById('prof-height').innerText = height;
      if (weight) document.getElementById('prof-target-weight').innerText = weight;
      if (period) document.getElementById('prof-period').innerText = period;
    }

    // 파일 선택 시 지정한 비율로 크롭해서 미리보기에 표시 (내보내기 시 비율 깨짐 방지)
    function previewImage(input, aspect) {
      const file = input.files[0];
      if (!file) return;
      const targetAspect = aspect || 1;

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const imgRatio = img.width / img.height;
          let sx, sy, sw, sh;
          if (imgRatio > targetAspect) {
            sh = img.height;
            sw = sh * targetAspect;
            sx = (img.width - sw) / 2;
            sy = 0;
          } else {
            sw = img.width;
            sh = sw / targetAspect;
            sx = 0;
            sy = (img.height - sh) / 2;
          }

          const canvas = document.createElement('canvas');
          const outW = 640;
          canvas.width = outW;
          canvas.height = Math.round(outW / targetAspect);
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);

          const box = input.closest('.img-upload-box');
          const previewImg = box.querySelector('.preview-img');
          previewImg.src = canvas.toDataURL('image/jpeg', 0.92);
          previewImg.style.display = 'block';
          box.classList.add('has-image');
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    // 모바일용 섹션 접기/펴기 토글
    function toggleSection(header) {
      const body = header.nextElementSibling;
      const arrow = header.querySelector('span');
      if (body.classList.contains('collapsed')) {
        body.classList.remove('collapsed');
        arrow.innerText = '▲';
      } else {
        body.classList.add('collapsed');
        arrow.innerText = '▼';
      }
    }


    // textarea는 html2canvas가 줄바꿈을 제대로 캡처하지 못해서,
    // 캡처 직전에 동일한 스타일의 <div>로 잠깐 바꿔치기 해준다.
    function swapTextareasForCapture(root) {
      const textareas = root.querySelectorAll('textarea');
      const swaps = [];
      textareas.forEach(ta => {
        const style = window.getComputedStyle(ta);
        const div = document.createElement('div');
        const hasValue = ta.value && ta.value.trim().length > 0;
        div.textContent = hasValue ? ta.value : (ta.getAttribute('placeholder') || '');
        div.style.cssText = `
          width:${ta.offsetWidth}px;
          min-height:${ta.offsetHeight}px;
          box-sizing:border-box;
          padding:${style.padding};
          border:${style.border};
          border-radius:${style.borderRadius};
          background:${style.backgroundColor};
          color:${hasValue ? style.color : '#9AA7B2'};
          font-size:${style.fontSize};
          font-family:${style.fontFamily};
          line-height:${style.lineHeight};
          white-space:pre-wrap;
          overflow-wrap:break-word;
          word-break:break-word;
        `;
        ta.insertAdjacentElement('afterend', div);
        ta.style.display = 'none';
        swaps.push({ ta, div });
      });
      return swaps;
    }

    function restoreTextareasAfterCapture(swaps) {
      swaps.forEach(({ ta, div }) => {
        div.remove();
        ta.style.display = '';
      });
    }

    // 전체 레이아웃을 한 장의 PNG 사진 파일로 저장 (지금 화면에 보이는 그대로 캡처)
    async function exportToImage() {
      // 캡처 전 모든 섹션 펼치기
      document.querySelectorAll('.section-body').forEach(b => b.classList.remove('collapsed'));

      const exportArea = document.getElementById('export-area');

      // 1) 줄바꿈 유지를 위해 textarea -> div로 임시 교체
      const textareaSwaps = swapTextareasForCapture(exportArea);

      // 2) 사진을 첨부하지 않은 빈 업로드 박스는 내보낼 때 숨김
      const emptyBoxes = Array.from(exportArea.querySelectorAll('.img-upload-box:not(.has-image)'));
      emptyBoxes.forEach(box => { box.style.display = 'none'; });

      try {
        const canvas = await html2canvas(exportArea, {
          scale: 2, // 이미지 화질 향상
          useCORS: true,
          backgroundColor: '#EAF7FC',
          windowWidth: 800,   // 모바일에서도 PC와 같은 그리드 레이아웃으로 캡처해서 세로로 길게 안 늘어나게 함
          windowHeight: exportArea.scrollHeight
        });
        const link = document.createElement('a');
        link.download = `Routine_Diary_${today.toISOString().slice(0,10)}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
      } finally {
        restoreTextareasAfterCapture(textareaSwaps);
        emptyBoxes.forEach(box => { box.style.display = ''; });
      }
    }
  </script>
</body>
</html>
